name: Refresh public AiCoN profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: public-profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install animation renderer
        run: python -m pip install Pillow==12.3.0
      - name: Refresh only public data
        run: python update_profile.py
      - name: Save refreshed snapshot
        run: |
          git add README.md assets/*.svg assets/*.gif data/public-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public AiCoN activity snapshot'
          git push
